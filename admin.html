<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#111413">
<title>Desk Art Admin</title>
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"><link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"><link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#111413;--ink:#F5F8F6;--muted:#9BA7A0;--green:#8EC641;--on:#0B0F0D;--dk:#070909;--lt:#1C2220;--red:#FF7A7A;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:1.02rem/1.55 Figtree,"Segoe UI",Arial,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
h2,h3{font-family:Sora,"Trebuchet MS",sans-serif;margin:0 0 .6rem;letter-spacing:-.02em}
.wrap{max-width:60rem;margin:0 auto;padding:0 1.1rem 4rem}
.neu{background:var(--bg);border-radius:1.2rem;box-shadow:.5rem .5rem 1rem var(--dk),-.5rem -.5rem 1rem var(--lt)}
.inset,input,select,textarea{background:var(--bg);border:0;border-radius:.9rem;box-shadow:inset .3rem .3rem .6rem var(--dk),inset -.3rem -.3rem .6rem var(--lt)}
input,select,textarea{width:100%;color:var(--ink);font:inherit;padding:.8rem 1rem;margin-bottom:1rem}
input[type=checkbox]{width:1.2rem;height:1.2rem;margin:0 .6rem 0 0;padding:0;accent-color:var(--green)}
input[type=file]{padding:.6rem}
label{display:block;font-weight:600;margin-bottom:.4rem}
label.chk{display:flex;align-items:center;margin-bottom:1rem}
:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.btn{border:0;cursor:pointer;font:inherit;font-weight:600;padding:.75rem 1.3rem;border-radius:.8rem;background:var(--green);color:var(--on);box-shadow:.3rem .3rem .7rem var(--dk),-.2rem -.2rem .6rem var(--lt)}
.btn.soft{background:var(--bg);color:var(--ink)}
.btn.sm{padding:.45rem .8rem;font-size:.9rem}
.btn.red{background:var(--bg);color:var(--red)}
.row{display:flex;flex-wrap:wrap;gap:.7rem;align-items:center}
.bar{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin:1.2rem 0}
header{display:flex;justify-content:space-between;align-items:center;padding:1rem 0}
header strong{font-family:Sora,sans-serif;font-size:1.2rem}
.tabs{display:flex;gap:.7rem;flex-wrap:wrap;margin-bottom:1rem}
.tab{border:0;cursor:pointer;font:inherit;font-weight:600;color:var(--muted);padding:.6rem 1.1rem;border-radius:2rem;background:var(--bg);box-shadow:.3rem .3rem .6rem var(--dk),-.3rem -.3rem .6rem var(--lt)}
.tab[aria-pressed=true]{color:var(--green);box-shadow:inset .3rem .3rem .6rem var(--dk),inset -.3rem -.3rem .6rem var(--lt)}
.box{padding:1.4rem;margin-bottom:1.2rem}
.item{display:flex;gap:1rem;align-items:center;padding:.9rem;margin-bottom:1.1rem;flex-wrap:wrap}
.th{width:6.5rem;aspect-ratio:16/10;border-radius:.7rem;overflow:hidden;display:grid;place-items:center;color:var(--muted);font-size:.8rem;flex:none;background:var(--bg);box-shadow:inset .2rem .2rem .5rem var(--dk),inset -.2rem -.2rem .5rem var(--lt)}
.th img{width:100%;height:100%;object-fit:cover}
#f-p{width:12rem;margin-bottom:1rem}
.meta{flex:1;min-width:8rem}.meta strong{display:block}
small{color:var(--muted)}
.acts{display:flex;gap:.5rem;flex-wrap:wrap}
.login{max-width:24rem;margin:18vh auto 0;padding:1.8rem}
.err{color:var(--red);min-height:1.4rem}
.dot{display:inline-block;width:.6rem;height:.6rem;border-radius:50%;background:var(--green);margin-right:.5rem}
.msg{white-space:pre-wrap;margin:.3rem 0 0}
#toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom));transform:translateX(-50%);padding:.7rem 1.2rem;border-radius:2rem;background:var(--green);color:var(--on);font-weight:600;opacity:0;pointer-events:none;transition:opacity .3s}
#toast.on{opacity:1}
[hidden]{display:none!important}
.btn,.tab{transition:transform .2s cubic-bezier(.2,.8,.2,1);-webkit-tap-highlight-color:transparent}.btn:active,.tab:active{transform:scale(.96)}
#view>*{animation:in .35s cubic-bezier(.2,.8,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:1.1rem;margin-bottom:1.4rem}
@media(min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{padding:1.2rem}.stat b{display:block;font-family:Sora,sans-serif;font-size:1.9rem;color:var(--green)}.stat span{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
<div id="login" class="login neu" hidden>
  <h2>Desk Art Admin</h2><p><small>Sign in with your admin email.</small></p>
  <label for="em">Email</label><input id="em" type="email" autocomplete="username">
  <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">
  <div class="err" id="err"></div>
  <button class="btn" id="go">Sign in</button>
</div>
<div id="app" hidden>
  <header><strong>Desk Art Admin</strong><div class="row"><a class="btn soft sm" href="./" target="_blank" style="text-decoration:none">View site</a><button class="btn soft sm" data-a="out">Sign out</button></div></header>
  <div class="tabs" id="tabs"></div>
  <div id="view"></div>
</div>
</div>
<div id="toast"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,collection,getDocs,addDoc,updateDoc,deleteDoc,query,orderBy} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyDh8F7ql6GxD7hmhGAbVlttX9CyZiJ7XH0",
  authDomain: "desk-art.firebaseapp.com",
  projectId: "desk-art",
  storageBucket: "desk-art.firebasestorage.app",
  messagingSenderId: "244783788913",
  appId: "1:244783788913:web:e3557d0701d69ec3937cd0"
};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const auth=getAuth(initializeApp(firebaseConfig)),db=getFirestore(auth.app);
const CATS=['Websites','Applications','Graphic Design'];
let W=[],E=[],S={},tab='ov',form=null,img='',thumb='';
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2200);}
async function run(fn){try{await fn();}catch(e){console.error(e);toast('Error: '+(e.code||e.message));}}
async function load(){
  const [a,b,s]=await Promise.all([getDocs(query(collection(db,'works'),orderBy('order'))),getDocs(query(collection(db,'enquiries'),orderBy('createdAt','desc'))).catch(()=>null),getDoc(doc(db,'site','main'))]);
  W=a.docs.map(d=>({id:d.id,...d.data()}));E=b?b.docs.map(d=>({id:d.id,...d.data()})):[];S=s.exists()?s.data():{};render();
}
function render(){
  const un=E.filter(e=>!e.read).length;
  $('#tabs').innerHTML=[['ov','Overview'],['works','Works'],['enq','Enquiries'+(un?' ('+un+')':'')],['set','Settings']].map(t=>`<button class="tab" data-t="${t[0]}" aria-pressed="${tab===t[0]}">${t[1]}</button>`).join('');
  $('#view').innerHTML=tab==='ov'?vOv():tab==='works'?vWorks():tab==='enq'?vEnq():vSet();
}
function vOv(){const vis=W.filter(w=>w.visible!==false).length,un=E.filter(e=>!e.read).length;
  return `<div class="bar"><h2>Overview</h2></div><div class="stats"><div class="stat neu"><b>${W.length}</b><span>Projects</span></div><div class="stat neu"><b>${vis}</b><span>Visible</span></div><div class="stat neu"><b>${un}</b><span>New enquiries</span></div><div class="stat neu"><b>${S.maintenance?'Off':'Live'}</b><span>Site status</span></div></div>
  <div class="neu box"><h3>Quick actions</h3><div class="row"><button class="btn" data-t="works" data-go="new">Add project</button><button class="btn soft" data-t="enq">Enquiries</button><button class="btn soft" data-t="set">Settings</button></div></div>`;}
function vWorks(){
  return `<div class="bar"><h2>Works</h2><button class="btn" data-a="new">Add project</button></div>`+(form?fWork(form):'')+
  (W.length?W.map((w,i)=>`<div class="item neu"><div class="th">${w.img?`<img src="${esc(w.thumb||w.img)}" alt="" decoding="async">`:'No image'}</div>
  <div class="meta"><strong>${esc(w.title)}</strong><small>${esc(w.type)}${w.visible===false?' (hidden)':''}</small></div>
  <div class="acts"><button class="btn soft sm" data-a="up" data-id="${w.id}" ${i?'':'disabled'} aria-label="Move up">▲</button><button class="btn soft sm" data-a="down" data-id="${w.id}" ${i<W.length-1?'':'disabled'} aria-label="Move down">▼</button>
  <button class="btn soft sm" data-a="vis" data-id="${w.id}">${w.visible===false?'Show':'Hide'}</button><button class="btn soft sm" data-a="edit" data-id="${w.id}">Edit</button><button class="btn red sm" data-a="del" data-id="${w.id}">Delete</button></div></div>`).join(''):'<p><small>No projects yet. Add your first one.</small></p>');
}
function fWork(w){return `<div class="neu box"><h3>${w.id?'Edit':'New'} project</h3>
 <label for="f-t">Title</label><input id="f-t" value="${esc(w.title)}">
 <label for="f-c">Category</label><select id="f-c">${CATS.map(c=>`<option ${w.type===c?'selected':''}>${c}</option>`).join('')}</select>
 <label for="f-d">One-line description</label><input id="f-d" value="${esc(w.desc)}">
 <label for="f-i">Image</label><input id="f-i" type="file" accept="image/*"><div class="th" id="f-p">${img?`<img src="${img}" alt="">`:'No image'}</div>
 <label class="chk"><input type="checkbox" id="f-v" ${w.visible!==false?'checked':''}>Show on website</label>
 <div class="row"><button class="btn" data-a="save">Save</button><button class="btn soft" data-a="cancel">Cancel</button></div></div>`;}
function vEnq(){
  return `<div class="bar"><h2>Enquiries</h2></div>`+(E.length?E.map(e=>`<div class="item neu"><div class="meta">${e.read?'':'<span class="dot"></span>'}<strong>${esc(e.name)||'No name'}</strong> <small>${esc(e.category)} | ${e.createdAt&&e.createdAt.toDate?e.createdAt.toDate().toLocaleString():''}</small><p class="msg">${esc(e.message)}</p></div>
  <div class="acts"><button class="btn soft sm" data-a="read" data-id="${e.id}">${e.read?'Mark unread':'Mark read'}</button><button class="btn red sm" data-a="delq" data-id="${e.id}">Delete</button></div></div>`).join(''):'<p><small>No enquiries yet. Messages sent from the contact form appear here.</small></p>');
}
function vSet(){return `<div class="bar"><h2>Settings</h2></div><div class="neu box">
 <label for="s-tag">Home banner line</label><input id="s-tag" value="${esc(S.tagline)}" placeholder="Websites, applications and graphics that win you clients.">
 <label for="s-ig">Instagram username</label><input id="s-ig" value="${esc(S.instagram)}" placeholder="yourhandle">
 <label for="s-wa">WhatsApp number with country code</label><input id="s-wa" value="${esc(S.whatsapp)}" inputmode="tel" placeholder="8801XXXXXXXXX">
 <label for="s-ms">Messenger username or page</label><input id="s-ms" value="${esc(S.messenger)}" placeholder="yourpage">
 <label for="s-ph">Call number with country code</label><input id="s-ph" value="${esc(S.phone)}" inputmode="tel" placeholder="8801XXXXXXXXX">
 <label class="chk"><input type="checkbox" id="s-mt" ${S.maintenance?'checked':''}>Maintenance mode (visitors see a notice instead of the site)</label>
 <label for="s-mm">Maintenance message</label><input id="s-mm" value="${esc(S.maintMsg)}" placeholder="We are updating the site. Please check back soon.">
 <button class="btn" data-a="saveset">Save settings</button></div>`;}
function scale(im,m,q){const k=Math.min(1,m/im.width),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q);}
function pack(f){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>res({img:scale(im,800,.74),thumb:scale(im,360,.7)});im.src=r.result;};r.readAsDataURL(f);});}
document.addEventListener('change',async e=>{if(e.target.id==='f-i'&&e.target.files[0]){const P=await pack(e.target.files[0]);img=P.img;thumb=P.thumb;$('#f-p').innerHTML=`<img src="${img}" alt="">`;}});
const by=id=>W.find(w=>w.id===id)||E.find(e=>e.id===id);
async function swap(id,d){const i=W.findIndex(w=>w.id===id),j=i+d;if(j<0||j>=W.length)return;const a=W[i],b=W[j];
  const ao=a.order||i+1,bo=b.order||j+1,na=bo===ao?bo+d:bo;a.order=na;b.order=ao;W.sort((x,y)=>(x.order||0)-(y.order||0));render();
  await Promise.all([updateDoc(doc(db,'works',a.id),{order:na}),updateDoc(doc(db,'works',b.id),{order:ao})]);}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-t]');if(t){tab=t.dataset.t;form=t.dataset.go==='new'?{visible:true}:null;if(form){img='';thumb='';}render();return;}
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id;
  run(async()=>{
    if(a==='out'){await signOut(auth);return;}
    if(a==='new'){form={visible:true};img='';thumb='';render();return;}
    if(a==='cancel'){form=null;render();return;}
    if(a==='edit'){form=by(id);img=form.img||'';thumb=form.thumb||'';render();window.scrollTo(0,0);return;}
    if(a==='save'){const title=$('#f-t').value.trim();if(!title){toast('Add a title');return;}
      const data={title,type:$('#f-c').value,desc:$('#f-d').value.trim(),img,thumb,visible:$('#f-v').checked};
      if(form.id)await updateDoc(doc(db,'works',form.id),data);
      else await addDoc(collection(db,'works'),{...data,order:Math.max(0,...W.map(w=>w.order||0))+1});
      form=null;toast('Saved');await load();return;}
    if(a==='del'){if(!confirm('Delete this project?'))return;W=W.filter(w=>w.id!==id);render();toast('Deleted');await deleteDoc(doc(db,'works',id));return;}
    if(a==='vis'){const w=by(id),v=w.visible===false;w.visible=v;render();await updateDoc(doc(db,'works',id),{visible:v});return;}
    if(a==='up'||a==='down'){await swap(id,a==='up'?-1:1);return;}
    if(a==='read'){const q=by(id);q.read=!q.read;render();await updateDoc(doc(db,'enquiries',id),{read:q.read});return;}
    if(a==='delq'){if(!confirm('Delete this enquiry?'))return;E=E.filter(e=>e.id!==id);render();await deleteDoc(doc(db,'enquiries',id));return;}
    if(a==='saveset'){await setDoc(doc(db,'site','main'),{tagline:$('#s-tag').value.trim(),instagram:$('#s-ig').value.trim(),whatsapp:$('#s-wa').value.trim(),messenger:$('#s-ms').value.trim(),phone:$('#s-ph').value.trim(),maintenance:$('#s-mt').checked,maintMsg:$('#s-mm').value.trim()},{merge:true});toast('Settings saved');await load();return;}
  });
});
$('#go').addEventListener('click',async()=>{$('#err').textContent='';
  try{await signInWithEmailAndPassword(auth,$('#em').value.trim(),$('#pw').value);}catch(e){$('#err').textContent='Wrong email or password.';}});
$('#pw').addEventListener('keydown',e=>{if(e.key==='Enter')$('#go').click();});
onAuthStateChanged(auth,u=>{$('#login').hidden=!!u;$('#app').hidden=!u;if(u)run(load);});
</script>
</body>
</html>
